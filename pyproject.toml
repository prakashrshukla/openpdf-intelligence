[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openpdf-intelligence"
version = "0.1.0"
description = "Local-first PDF utilities with Chandra OCR 2"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenPDF Intelligence contributors" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "streamlit>=1.38,<2.0",
  "pypdf>=5.0,<7.0",
  "pymupdf>=1.24,<2.0",
  "pillow>=10.0",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "markdown>=3.7",
]

[project.optional-dependencies]
hf = ["chandra-ocr>=0.1"]
vllm = ["chandra-ocr>=0.1"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["openpdf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
